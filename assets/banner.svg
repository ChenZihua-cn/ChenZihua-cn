<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="50%" stop-color="#1a1b3a"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </linearGradient>

    <!-- Star glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shooting star gradient -->
    <linearGradient id="shooting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes twinkle1 { 0%,100%{opacity:0.2} 50%{opacity:1} }
      @keyframes twinkle2 { 0%,100%{opacity:0.5} 50%{opacity:0.1} }
      @keyframes twinkle3 { 0%,100%{opacity:0.1} 40%{opacity:0.9} 60%{opacity:0.3} }
      @keyframes float1 { 0%{transform:translateY(0)} 100%{transform:translateY(-10px)} }
      @keyframes float2 { 0%{transform:translateY(0)} 100%{transform:translateY(8px)} }
      @keyframes float3 { 0%{transform:translateY(0)} 100%{transform:translateY(-6px)} }
      @keyframes shoot { 0%{transform:translate(0,0);opacity:0} 5%{opacity:1} 15%{opacity:0;transform:translate(-300px,200px)} 100%{opacity:0;transform:translate(-300px,200px)} }
      @keyframes titlePulse { 0%,100%{opacity:0.8} 50%{opacity:1} }
      .star1 { animation: twinkle1 3s ease-in-out infinite; }
      .star2 { animation: twinkle2 2.5s ease-in-out infinite; }
      .star3 { animation: twinkle3 4s ease-in-out infinite; }
      .float1 { animation: float1 4s ease-in-out infinite alternate; }
      .float2 { animation: float2 3.5s ease-in-out infinite alternate; }
      .float3 { animation: float3 5s ease-in-out infinite alternate; }
      .shoot { animation: shoot 8s linear infinite; }
      .title { animation: titlePulse 2s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Shooting star -->
  <g class="shoot">
    <line x1="680" y1="20" x2="720" y2="0" stroke="url(#shooting)" stroke-width="1.5"/>
  </g>
  <g class="shoot" style="animation-delay:3s">
    <line x1="750" y1="60" x2="790" y2="40" stroke="url(#shooting)" stroke-width="1"/>
  </g>

  <!-- Stars Layer 1 - large bright stars -->
  <g filter="url(#glow)" class="float1">
    <circle cx="120" cy="45" r="1.5" fill="#c4b5fd" class="star1"/>
    <circle cx="680" cy="55" r="1.8" fill="#a78bfa" class="star2"/>
    <circle cx="350" cy="30" r="1.3" fill="#e0e7ff" class="star3"/>
    <circle cx="550" cy="40" r="1.6" fill="#c4b5fd" class="star1"/>
    <circle cx="200" cy="70" r="1.4" fill="#ddd6fe" class="star2"/>
    <circle cx="720" cy="90" r="1.2" fill="#a78bfa" class="star3"/>
  </g>

  <!-- Stars Layer 2 - medium stars -->
  <g class="float2">
    <circle cx="60" cy="80" r="1" fill="#818cf8" class="star2"/>
    <circle cx="180" cy="120" r="0.8" fill="#a5b4fc" class="star1"/>
    <circle cx="300" cy="50" r="1.1" fill="#c7d2fe" class="star3"/>
    <circle cx="450" cy="25" r="0.9" fill="#818cf8" class="star1"/>
    <circle cx="500" cy="100" r="1" fill="#a5b4fc" class="star2"/>
    <circle cx="620" cy="75" r="0.8" fill="#c7d2fe" class="star1"/>
    <circle cx="750" cy="130" r="1.1" fill="#818cf8" class="star3"/>
    <circle cx="80" cy="150" r="0.9" fill="#a5b4fc" class="star2"/>
    <circle cx="400" cy="80" r="1" fill="#ddd6fe" class="star1"/>
  </g>

  <!-- Stars Layer 3 - small dots -->
  <g class="float3">
    <circle cx="30" cy="30" r="0.5" fill="#6366f1" class="star3"/>
    <circle cx="150" cy="90" r="0.6" fill="#6366f1" class="star2"/>
    <circle cx="250" cy="140" r="0.5" fill="#6366f1" class="star1"/>
    <circle cx="380" cy="110" r="0.6" fill="#6366f1" class="star3"/>
    <circle cx="470" cy="60" r="0.5" fill="#6366f1" class="star1"/>
    <circle cx="580" cy="130" r="0.6" fill="#6366f1" class="star2"/>
    <circle cx="660" cy="160" r="0.5" fill="#6366f1" class="star3"/>
    <circle cx="770" cy="30" r="0.6" fill="#6366f1" class="star1"/>
    <circle cx="100" cy="170" r="0.5" fill="#6366f1" class="star2"/>
    <circle cx="320" cy="160" r="0.5" fill="#6366f1" class="star3"/>
  </g>

  <!-- Text -->
  <text x="400" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#c4b5fd" filter="url(#textGlow)" class="title">
    Cyan's Github
  </text>

  <!-- Bottom line decoration -->
  <line x1="320" y1="125" x2="480" y2="125" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="350" y1="130" x2="450" y2="130" stroke="#a78bfa" stroke-width="0.8" opacity="0.4"/>

  <!-- Subtitle dots -->
  <g class="float1">
    <circle cx="318" cy="125" r="2" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="482" cy="125" r="2" fill="#a78bfa" filter="url(#glow)"/>
  </g>
</svg>
